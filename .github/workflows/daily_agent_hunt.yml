name: Daily Autonomous Job Hunt Agent

on:
  schedule:
    # 02:00 UTC = 08:00 AM Bangladesh Standard Time (BST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'yourfiendjob_db' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT_EMAIL: ${{ secrets.GMAIL_RECIPIENT_EMAIL }}
        run: |
          python main.py --limit 30

      - name: Upload Daily Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-job-reports
          path: |
            data/jobs.xlsx
            data/jobs.json
            logs/*.log
          retention-days: 14
